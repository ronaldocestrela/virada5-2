services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no arquivo .env}"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -No -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 10

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      DB_CONNECTION_STRING: "${DB_CONNECTION_STRING:?Defina DB_CONNECTION_STRING no arquivo .env}"
      DATA_PROTECTION_KEYS_PATH: "/var/virada5x2/dataprotection-keys"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-Virada5x2.WebApp}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_HEADERS: "${OTEL_EXPORTER_OTLP_HEADERS:-}"
      SERILOG_MINIMUM_LEVEL: "${SERILOG_MINIMUM_LEVEL:-Information}"
      SERILOG_LOG_FILE_PATH: "${SERILOG_LOG_FILE_PATH:-}"
    ports:
      - "8080:8080"
    volumes:
      - dataprotection_keys:/var/virada5x2/dataprotection-keys

volumes:
  sqlserver_data:
  dataprotection_keys:

